name: Extension labels
on:
  push:
    branches: [replacement-extension-labels-01]
    paths: [.github/extension-label-ready.txt]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        default: '1'
        required: true
permissions:
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: extension-labels
  cancel-in-progress: false
jobs:
  label:
    if: github.repository == 'mohanad-hafez/azd-extension-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check label rules
        run: node --test .github/scripts/extension_labels.test.mjs
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ inputs.pr_number || '1' }}
        with:
          retries: 0
          script: |
            const fs=require('node:fs');
            const {runExtensionLabels}=await import(process.env.GITHUB_WORKSPACE+'/.github/scripts/extension_labels.mjs');
            await runExtensionLabels({github,context,prNumber:Number(process.env.PR_NUMBER),checkpoint:r=>fs.writeFileSync('extension-label-result.json',JSON.stringify(r,null,2))});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extension-label-result
          path: extension-label-result.json
          retention-days: 7
